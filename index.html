  if(t=='s'){const m=c.match(/<v>(\d+)<\/v>/);v=m?ss[+m[1]]||'':''}else if(t=='inlineStr')v=(c.match(/<t\b[^>]*>[\s\S]*?<\/t>/g)||[]).map(z=>z.replace(/<[^>]+>/g,'')).join('');else{const m=c.match(/<v>([\s\S]*?)<\/v>/);v=m?m[1]:''}row[ci]=xd(v)});rows.push(row)});return rows}
const ssList=x=>(x.match(/<si>[\s\S]*?<\/si>/g)||[]).map(si=>(si.replace(/<rPh[\s\S]*?<\/rPh>/g,'').match(/<t\b[^>]*>[\s\S]*?<\/t>/g)||[]).map(z=>z.replace(/<[^>]+>/g,'')).join(''));
function csvRows(t){const rows=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==','){r.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);rows.push(r);r=[];c=''}else c+=ch}if(c!==''||r.length){r.push(c);rows.push(r)}return rows}
function importRows(rows){if(rows.length&&String(rows[0][0]||'').includes('中文名稱'))rows=rows.slice(1);const add=[],bad=[];
 rows.forEach(r=>{const n=String(r[0]||'').trim(),f=String(r[1]||'').trim().replace(/（/g,'(').replace(/）/g,')');if(!n&&!f)return;
  (f.match(/\(([^()]*)\)\d+/g)||[]).forEach(m=>{const a=atoms(m.slice(1,m.indexOf(')')));if(!a.err&&a.l.length){const k=canon(a.l);if(!D.groups.includes(k))D.groups.push(k)}});
  const p=parseF(f);if(!n||p.err){bad.push(n||f);return}add.push({n,f,d:String(r[2]||'').includes('難')?'難':'易',h:String(r[3]||'').trim(),e:String(r[4]||'').trim(),c:1})});
 if(!add.length){alert('沒有可匯入的題目，請確認欄位：中文名稱、化學式、難易、提示、說明');return}
 if(confirm('讀到 '+add.length+' 題'+(bad.length?'（略過 '+bad.length+' 題化學式有誤：'+bad.slice(0,5).join('、')+'）':'')+'。\n按「確定」＝取代現有題庫\n按「取消」＝加到現有題庫後面'))D.bank=add;else D.bank=D.bank.concat(add);save();tpanel()}

 $('rg').value=D.range;$('rg').onchange=()=>{D.range=$('rg').value;save()};$('nn').value=D.n;$('nh').value=D.nh;$('nn').onchange=$('nh').onchange=()=>{D.n=Math.max(1,Math.min(20,+$('nn').value||10));D.nh=Math.max(0,Math.min(D.n,+$('nh').value||0));$('nn').value=D.n;$('nh').value=D.nh;save()};$('tf').oninput=pv;
