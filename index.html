 $('ovl').innerHTML='<div class="ov"><div class="box"><h3>🔬 編輯元素介紹與圖片</h3><div style="background:#fff9ec;border:1px solid #e0a040;border-radius:8px;padding:6px 10px;margin:4px 0"><b>用 Excel 一次編輯：</b><button id="eex">匯出元素介紹（Excel）</button><label><button onclick="this.nextSibling.click()">匯入元素介紹（Excel）</button><input type="file" id="eimp" accept=".xlsx,.csv" style="display:none"></label><br><small>匯出的檔案包含全部 118 個元素，已有的介紹會一起帶出來。在 Excel 填寫後再匯入：有填內容的列才會更新，空白列不變。圖片無法放進 Excel，請在下方逐一上傳。</small></div>選擇元素：<select id="es">'+KS.map(k=>'<option value="'+k+'"'+(k==sym?' selected':'')+'>'+EL[k].z+' '+k+' '+EL[k].zh+(hasInfo(k)?' ★':'')+'</option>').join('')+'</select> <small>★＝已有介紹（修改後要先按「儲存」再換元素）</small><br>英文名稱<input id="ee" style="width:180px" value="'+esc(i.en)+'"> 常溫狀態<select id="est"><option></option><option>固體</option><option>液體</option><option>氣體</option></select><br>簡介<br><textarea id="ed" rows="2">'+esc(i.d)+'</textarea><br>生活用途<br><textarea id="eu" rows="2">'+esc(i.u)+'</textarea><br>小知識<br><textarea id="ef" rows="2">'+esc(i.f)+'</textarea><br>圖片（最多 3 張，會自動縮小）：<input type="file" id="efi" accept="image/*" multiple><div id="eim"></div>圖片來源<input id="esr" style="width:70%" value="'+esc(i.src||'')+'" placeholder="例如：老師自行拍攝／網址或作者"><div id="emsg" class="good"></div><hr><button id="esv" style="background:#e8f5e9">儲存</button><button id="epv">儲存並預覽</button><button id="erst">清除此元素的自訂內容與圖片</button><button id="ebk" style="float:right">回題庫設定</button></div></div>';
 $('est').value=i.st||'';const draw=()=>{$('eim').innerHTML=ims.map((x,k)=>'<span class="thumb"><img src="'+x+'"><button data-k="'+k+'">刪除</button></span>').join('')||'<small>（尚無圖片）</small>'};draw();
 $('eim').onclick=async e=>{const k=e.target.dataset.k;if(k===undefined)return;ims.splice(+k,1);await imgSet(sym,ims);draw()};
 $('efi').onchange=async e=>{for(const f of [...e.target.files]){if(ims.length>=3){$('emsg').textContent='最多 3 張，其餘略過';break}try{ims.push(await resize(f))}catch(x){}}await imgSet(sym,ims);e.target.value='';draw()};
 const save=()=>{EO[sym]={en:$('ee').value.trim(),st:$('est').value,d:$('ed').value.trim(),u:$('eu').value.trim(),f:$('ef').value.trim(),src:$('esr').value.trim()};saveEO();markStars();$('emsg').textContent='✅ 已儲存'};
 $('esv').onclick=save;$('epv').onclick=()=>{save();showEl(sym,true)};
 $('erst').onclick=async()=>{if(!confirm('確定清除 '+EL[sym].zh+' 的自訂內容與圖片？（內建介紹會還原）'))return;delete EO[sym];saveEO();await imgSet(sym,[]);markStars();elPanel(sym)};
 $('ebk').onclick=tpanel;
 $('eex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(xlsx([['原子序','元素符號','中文名稱','英文名稱','常溫狀態（固體/液體/氣體）','簡介','生活用途','小知識','圖片來源']].concat(KS.map(k=>{const t=getInfo(k);return[EL[k].z,k,EL[k].zh,t.en,t.st,t.d,t.u,t.f,t.src||'']})),[8,10,10,16,14,40,40,40,20]));a.download='元素介紹.xlsx';a.click()};
 $('eimp').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const rows=await readRows(f);let n=0,bad=0;(rows.length&&String(rows[0][0]||'').includes('原子序')?rows.slice(1):rows).forEach(r=>{const g=i=>String(r[i]==null?'':r[i]).trim();let k=g(1);if(!EL[k])k=KS[+g(0)-1];if(!EL[k]){if(g(0)||g(1))bad++;return}
   const st=/固/.test(g(4))?'固體':/液/.test(g(4))?'液體':/氣/.test(g(4))?'氣體':'',o={en:g(3),st,d:g(5),u:g(6),f:g(7),src:g(8)};if(!(o.en||o.st||o.d||o.u||o.f||o.src))return;EO[k]=o;n++});saveEO();markStars();alert('匯入完成：更新了 '+n+' 個元素的介紹'+(bad?'（有 '+bad+' 列找不到對應的元素，已略過）':''));elPanel(sym)}catch(x){alert('讀不到檔案，請確認是 .xlsx 或 .csv 檔')}e.target.value=''};$('es').onchange=()=>elPanel($('es').value)}
// ---- 老師模式 ----
let ed=-1;
$('tb').onclick=()=>{$('ovl').innerHTML='<div class="ov"><div class="box"><h3>老師模式</h3><input id="pw" type="password" placeholder="密碼"><button id="pwo">進入</button><button id="pwx">取消</button><div id="pwm" class="bad"></div></div></div>';
 $('pwx').onclick=()=>{$('ovl').innerHTML=''};$('pwo').onclick=()=>{if($('pw').value=='scigjong6838')tpanel();else $('pwm').textContent='密碼錯誤'}};
function tpanel(){ed=-1;$('ovl').innerHTML=`<div class="ov"><div class="box"><h3>老師模式</h3><details id="tdoc"><summary>【題庫操作說明】（按一下展開）</summary><ol>
<li><b>新增題目</b>：在「新增題目」填中文名稱、化學式（用一般數字，如 Al2(SO4)3）、選「易」或「難」，提示與說明可以空白（說明會在答對後顯示），按「新增」。輸入化學式時，下方會即時預覽化學式、分子量和學生要按的順序，紅字代表有錯。</li>
<li><b>括號規則</b>：兩個以上相同的原子團才加括號，如 Ca(OH)2；只有一個原子團不加括號，如 NaOH。</li>
<li><b>編輯、刪除</b>：在題庫列表按「編輯」，資料會回到上方欄位，改完按「更新」；按「刪除」就移除該題。</li>
<li><b>原子團</b>：括號裡的原子團必須在「原子團」清單中。需要新的，在欄位輸入如 ClO3，按「新增原子團」。</li>
<li><b>出題設定</b>：選出題範圍（全部、只考基本、只考進階、只考自訂題），並設定每局題數與其中的進階題數（範圍選「全部」時才依此分配）。改完要按最下方「完成並重新開始」才會套用。</li>
<li><b>Excel 匯出匯入</b>：「匯出題庫（Excel）」會下載 化學式題庫.xlsx，欄位依序是中文名稱、化學式、難易（易/難）、提示、說明，第一列是標題。在 Excel 修改存檔後，按「匯入題庫」選檔案，跳出視窗時按「確定」＝取代現有題庫、按「取消」＝加到現有題庫後面。也可匯入 CSV。</li>
<li><b>備份提醒</b>：題庫存在這台電腦的這個瀏覽器裡，換電腦或清除瀏覽器資料就會消失，請定期匯出備份。「還原預設題庫」會刪除所有自訂題。</li></ol></details><div style="margin:4px 0"><button id="tel" style="background:#e8f5e9">🔬 元素認識：編輯元素介紹與圖片</button></div>出題範圍：<select id="rg"><option value="all">全部</option><option value="easy">只考基本（易）</option><option value="hard">只考進階（難）</option><option value="custom">只考自訂題</option></select>　每局<input id="nn" type="number" min="1" max="20" style="width:64px">題，其中進階<input id="nh" type="number" min="0" max="20" style="width:64px">題<small>（範圍選「全部」時依此分配）</small>
<hr><b id="ft">新增題目</b><br><input id="tn" placeholder="中文名稱，如 硫酸鋁"><input id="tf" placeholder="化學式，如 Al2(SO4)3"><select id="td"><option>易</option><option>難</option></select><input id="th" placeholder="提示（可空白）"><br><input id="te" placeholder="說明內容（答對後顯示，可空白）" style="width:90%"><button id="ta">新增</button><div id="tp" style="font-size:20px;min-height:28px"></div>
<hr><b>題庫</b><table id="tl"></table><hr><b>原子團</b>（寫法如 SO4）：<span id="tg2"></span><br><input id="gi" placeholder="新增原子團，如 ClO3"><button id="ga">新增原子團</button><div id="gm" class="bad"></div>
<hr><button id="ex">匯出題庫（Excel）</button><label><button onclick="this.nextSibling.click()">匯入題庫（Excel／CSV）</button><input type="file" id="im" accept=".xlsx,.csv,.json" style="display:none"></label><button id="rs">還原預設題庫</button><button id="tc" style="float:right;background:#2e7d32;color:#fff">完成並重新開始</button></div></div>`;
 $('rg').value=D.range;$('rg').onchange=()=>{D.range=$('rg').value;save()};$('nn').value=D.n;$('nh').value=D.nh;$('nn').onchange=$('nh').onchange=()=>{D.n=Math.max(1,Math.min(20,+$('nn').value||10));D.nh=Math.max(0,Math.min(D.n,+$('nh').value||0));$('nn').value=D.n;$('nh').value=D.nh;save()};$('tf').oninput=pv;
 $('ta').onclick=()=>{const n=$('tn').value.trim(),f=$('tf').value.trim(),r=parseF(f);if(!n||r.err){$('tp').innerHTML='<span class="bad">'+(r.err||'請輸入名稱')+'</span>';return}
  const q={n,f,d:$('td').value,h:$('th').value.trim(),e:$('te').value.trim(),c:1};if(ed>=0){q.c=D.bank[ed].c;D.bank[ed]=q}else D.bank.push(q);save();tlist();$('tn').value=$('tf').value=$('th').value=$('te').value='';ed=-1;$('ta').textContent='新增';$('ft').textContent='新增題目';$('tp').innerHTML=''};
 $('ga').onclick=()=>{const p=atoms($('gi').value.trim());if(p.err||!p.l.length){$('gm').textContent=p.err||'請輸入原子團';return}const k=canon(p.l);if(!D.groups.includes(k))D.groups.push(k);$('gm').textContent='';$('gi').value='';save();tlist()};
 $('ex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(xlsx([['中文名稱','化學式','難易（易/難）','提示','說明']].concat(D.bank.map(q=>[q.n,q.f,q.d,q.h||'',q.e||'']))));a.download='化學式題庫.xlsx';a.click()};
 $('im').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const buf=await f.arrayBuffer();
  if(/\.json$/i.test(f.name)){const o=JSON.parse(new TextDecoder().decode(buf));if(!o.bank)throw 0;D=o;save();tpanel();return}
  let rows;if(/\.xlsx$/i.test(f.name)){const z=await unzip(buf),sn=Object.keys(z).filter(k=>/^xl\/worksheets\/sheet\d+\.xml$/.test(k)).sort()[0];rows=sheetRows(z[sn],z['xl/sharedStrings.xml']?ssList(z['xl/sharedStrings.xml']):[])}
  else{let t;try{t=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(x){t=new TextDecoder('big5').decode(buf)}rows=csvRows(t.replace(/^\uFEFF/,''))}
  importRows(rows)}catch(x){alert('讀不到檔案，請確認是 .xlsx 或 .csv 檔')}e.target.value=''};
 $('rs').onclick=()=>{if(confirm('確定還原預設題庫？自訂題會消失')){localStorage.removeItem(K);location.reload()}};
 $('tc').onclick=run;$('tel').onclick=()=>elPanel();tlist()}
function pv(){const f=$('tf').value,r=parseF(f);$('tp').innerHTML=!f?'':r.err?'<span class="bad">'+r.err+'</span>':fh(r.items)+'　分子量 '+mass(r.items)+'　按鍵：'+r.items.map(x=>x.t=='g'?'['+x.v+']':x.v).join(' ')}
function tlist(){$('tg2').innerHTML=D.groups.map(gh).join('、');$('tl').innerHTML=D.bank.map((q,i)=>'<tr><td>'+esc(q.n)+'</td><td>'+esc(q.f)+'</td><td>'+q.d+(q.c?' ★':'')+'</td><td><button data-e="'+i+'">編輯</button><button data-d="'+i+'">刪除</button></td></tr>').join('');
 $('tl').onclick=e=>{const t=e.target.dataset;if(t.d!==undefined){D.bank.splice(+t.d,1);save();tlist()}if(t.e!==undefined){ed=+t.e;const q=D.bank[ed];$('tn').value=q.n;$('tf').value=q.f;$('td').value=q.d;$('th').value=q.h;$('te').value=q.e||'';$('ta').textContent='更新';$('ft').textContent='編輯題目';pv()}}}
markStars();
function fitTiles(){const R=document.documentElement.style;let k=1.3;R.setProperty('--k',k);for(let n=0;n<4;n++){let w=0;document.querySelectorAll('#pt .el:not(.demo)').forEach(e=>{const r1=e.querySelector('.r1'),bb=r1.querySelector('b');bb.style.marginLeft='';bb.style.marginLeft=(-.2*bb.offsetWidth)+'px';const need=r1.children[0].getBoundingClientRect().width+r1.children[1].getBoundingClientRect().width,have=e.clientWidth-parseFloat(getComputedStyle(e).paddingLeft)*2;w=Math.max(w,need/have)});if(w<=1)break;k=Math.max(1,k/w*.98);R.setProperty('--k',k)}}
addEventListener('resize',fitTiles);fitTiles();
run();
</script></body></html>
